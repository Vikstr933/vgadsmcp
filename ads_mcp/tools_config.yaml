# tools_config.yaml
#
# Tools configuration for the Google Ads MCP server.
# Modify this file to enable/disable tool namespaces or set custom prefixes.

namespaces:
  customers: true
  search: true
  metadata: true
  keyword_planning: true
  # Discovery is enabled; actual writes still require server policy + owner approval.
  writes: true
  # Uses a separate LinkedIn OAuth grant and account policy. No vendor relay.
  linkedin: true
